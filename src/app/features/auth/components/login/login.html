<!-- Login Component - Modern Tasarım -->
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center bg-[#F3F4F6] dark:bg-[#1F2937] px-4">
  <div class="flex flex-col items-center justify-center pb-8">
    <!-- Timer Icon -->
    <div class="bg-[#3B82F6] p-3 rounded-full mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 text-white">
        <path fill-rule="evenodd" d="M12.75 2.75a.75.75 0 00-1.5 0V4.5H9.276a1.75 1.75 0 00-.985.303L6.596 5.957A.25.25 0 016.455 6H2.353a.75.75 0 100 1.5H3.93L.563 15.18a.762.762 0 00.21.88c.08.064.161.125.309.221.186.121.452.278.792.433.68.311 1.662.62 2.876.62a6.919 6.919 0 002.876-.62c.34-.155.606-.312.792-.433.15-.097.23-.158.31-.223a.75.75 0 00.209-.878L5.569 7.5h.886c.351 0 .694-.106.984-.303l1.695-1.154A.25.25 0 019.275 6h1.975V4.5H12.75V2.75z" clip-rule="evenodd" />
        <path d="M11.25 7.5H9.275a.25.25 0 00-.141.043l-1.695 1.154a1.75 1.75 0 01-.984.303H5.569l3.368 7.68a.75.75 0 01-.209.878c-.08.065-.16.126-.31.223a3.283 3.283 0 01-.792.433 6.919 6.919 0 01-2.876.62 6.919 6.919 0 01-2.876-.62 3.285 3.285 0 01-.792-.433c-.148-.096-.229-.156-.309-.221a.762.762 0 01-.21-.88L3.93 9H2.353a.75.75 0 010-1.5H6.455c.351 0 .694.106.984.303l1.695 1.154a1.75 1.75 0 00.985.303h1.131V7.5z" />
      </svg>
    </div>
    <h1 class="text-gray-900 dark:text-white tracking-light text-[32px] font-bold leading-tight text-center">{{ 'auth.welcomeBack' | translate }}</h1>
    <p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal text-center pt-1">{{ 'auth.loginSubtitle' | translate }}</p>
  </div>

  <div class="w-full max-w-sm">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Error Message -->
      <app-error-message *ngIf="errorMessage" [message]="errorMessage" [show]="!!errorMessage" class="mb-4"></app-error-message>

      <div class="flex flex-col gap-4 py-3">
        <!-- Email Input -->
        <label class="flex flex-col w-full">
          <p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">{{ 'auth.email' | translate }}</p>
          <div class="flex w-full flex-1 items-stretch rounded-lg">
            <input
              formControlName="email"
              type="email"
              autocomplete="email"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-[#3B82F6] border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-[#3B82F6] h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal"
              [class.border-red-500]="email?.invalid && email?.touched"
              [placeholder]="'auth.emailPlaceholder' | translate">
          </div>
          <p *ngIf="email?.invalid && email?.touched" class="mt-1 text-sm text-red-500">
            <span *ngIf="email?.errors?.['required']">{{ 'auth.emailRequired' | translate }}</span>
            <span *ngIf="email?.errors?.['email']">{{ 'auth.invalidEmail' | translate }}</span>
          </p>
        </label>

        <!-- Password Input -->
        <label class="flex flex-col w-full">
          <p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">{{ 'auth.password' | translate }}</p>
          <div class="flex w-full flex-1 items-stretch rounded-lg">
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-[#3B82F6] border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-[#3B82F6] h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal"
              [class.border-red-500]="password?.invalid && password?.touched"
              [placeholder]="'auth.passwordPlaceholder' | translate">
            <button
              type="button"
              (click)="togglePassword()"
              class="text-gray-400 dark:text-gray-500 flex border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-4 rounded-r-lg border-l-0 hover:text-gray-600 dark:hover:text-gray-300">
              <!-- Eye Icon -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                <path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM17.25 12a5.25 5.25 0 11-10.5 0 5.25 5.25 0 0110.5 0z" clip-rule="evenodd" />
              </svg>
              <!-- Eye Slash Icon -->
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                <path d="M3.53 2.47a.75.75 0 00-1.06 1.06l18 18a.75.75 0 101.06-1.06l-18-18zM22.676 12.553a11.249 11.249 0 01-2.631 4.31l-3.099-3.099a5.25 5.25 0 00-6.71-6.71L7.759 4.577a11.217 11.217 0 014.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113z" />
                <path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0115.75 12zM12.53 15.713l-4.243-4.244a3.75 3.75 0 004.243 4.243z" />
                <path d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 00-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 016.75 12z" />
              </svg>
            </button>
          </div>
          <p *ngIf="password?.invalid && password?.touched" class="mt-1 text-sm text-red-500">
            <span *ngIf="password?.errors?.['required']">{{ 'auth.passwordRequired' | translate }}</span>
            <span *ngIf="password?.errors?.['minlength']">{{ 'auth.passwordMinLength' | translate }}</span>
          </p>
        </label>
      </div>

      <!-- Forgot Password Link -->
      <div class="flex justify-end pt-2 pb-6">
        <p class="text-[#3B82F6] text-sm font-medium leading-normal underline cursor-pointer hover:text-blue-500">{{ 'auth.forgotPassword' | translate }}</p>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="isLoading || loginForm.invalid"
        class="w-full bg-[#3B82F6] text-white font-bold py-4 px-4 rounded-lg text-base leading-normal hover:bg-[#3B82F6]/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <span *ngIf="!isLoading">{{ 'auth.login' | translate }}</span>
        <app-loading-spinner *ngIf="isLoading" size="small" color="white"></app-loading-spinner>
      </button>

      <!-- Sign Up Link -->
      <div class="text-center pt-6">
        <p class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-normal">
          {{ 'auth.noAccount' | translate }}
          <a routerLink="/signup" class="text-[#3B82F6] font-medium underline hover:text-blue-500">{{ 'auth.signupHere' | translate }}</a>
        </p>
      </div>
    </form>
  </div>
</div>
