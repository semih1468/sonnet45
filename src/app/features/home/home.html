<!-- T057: Home Component HTML Template -->
<div class="min-h-screen bg-gray-50" [ngClass]="getModeClass()">
  <!-- Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">Pomodoro Timer</h1>

        <nav class="flex space-x-4">
          <a routerLink="/tasks" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
            Görevler
          </a>
          <a routerLink="/statistics" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
            İstatistikler
          </a>
          <a routerLink="/settings" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
            Ayarlar
          </a>
          <button (click)="logout()" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
            Çıkış
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white rounded-lg shadow-xl p-8" *ngIf="timerState">
      <!-- Mode Title -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">
          {{ getModeTitle() }}
        </h2>
        <p class="text-gray-600">
          Tamamlanan Pomodoro: {{ timerState.completedPomodoros }}
        </p>
      </div>

      <!-- Timer Display -->
      <div class="timer-display mb-12">
        <div class="text-center">
          <div class="text-8xl font-bold text-gray-900 font-mono">
            {{ timerState.remainingTime | duration }}
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex justify-center space-x-4 mb-8">
        <button
          (click)="onButtonClick()"
          class="px-8 py-4 rounded-lg text-white text-lg font-semibold shadow-lg hover:shadow-xl transition-all duration-200"
          [ngClass]="{
            'bg-primary-600 hover:bg-primary-700': timerState.mode === 'work',
            'bg-green-600 hover:bg-green-700': timerState.mode === 'shortBreak',
            'bg-blue-600 hover:bg-blue-700': timerState.mode === 'longBreak'
          }">
          {{ getButtonText() }}
        </button>

        <button
          (click)="onReset()"
          [disabled]="!timerState.isRunning && !timerState.isPaused"
          class="px-6 py-4 rounded-lg bg-gray-200 text-gray-700 text-lg font-semibold hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
          Sıfırla
        </button>

        <button
          (click)="onSkip()"
          [disabled]="!timerState.isRunning && !timerState.isPaused"
          class="px-6 py-4 rounded-lg bg-gray-200 text-gray-700 text-lg font-semibold hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200">
          Atla
        </button>
      </div>

      <!-- Mode Indicator -->
      <div class="flex justify-center space-x-2">
        <div
          class="w-3 h-3 rounded-full"
          [ngClass]="timerState.mode === 'work' ? 'bg-primary-600' : 'bg-gray-300'">
        </div>
        <div
          class="w-3 h-3 rounded-full"
          [ngClass]="timerState.mode === 'shortBreak' ? 'bg-green-600' : 'bg-gray-300'">
        </div>
        <div
          class="w-3 h-3 rounded-full"
          [ngClass]="timerState.mode === 'longBreak' ? 'bg-blue-600' : 'bg-gray-300'">
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div class="bg-white rounded-lg shadow-xl p-8 text-center" *ngIf="!timerState">
      <div class="text-gray-600">Yükleniyor...</div>
    </div>
  </main>
</div>
