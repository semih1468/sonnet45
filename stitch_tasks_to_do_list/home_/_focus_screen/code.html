<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pomodoro Timer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#FF4B4B",
            "background-light": "#F8F8F8",
            "background-dark": "#230f0f",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col items-center justify-between p-4">
<div class="flex w-full items-center justify-between">
<h1 class="text-xl font-bold text-slate-900 dark:text-white">Pomodoro</h1>
<button class="flex h-10 w-10 items-center justify-center rounded-full text-slate-900 dark:text-white">
<span class="material-symbols-outlined">
          settings
        </span>
</button>
</div>
<div class="relative flex h-[300px] w-[300px] items-center justify-center">
<svg class="absolute h-full w-full" viewbox="0 0 100 100">
<circle class="stroke-current text-slate-200 dark:text-slate-700" cx="50" cy="50" fill="none" r="45" stroke-width="5"></circle>
<circle class="origin-[50%_50%] -rotate-90 stroke-current text-primary" cx="50" cy="50" fill="none" r="45" stroke-dasharray="282.74" stroke-dashoffset="70.685" stroke-width="5"></circle>
</svg>
<div class="relative flex flex-col items-center justify-center">
<p class="text-sm font-medium uppercase tracking-widest text-slate-500 dark:text-slate-400">Focus</p>
<h1 class="text-6xl font-black text-slate-900 dark:text-white">25:00</h1>
<button class="mt-4 flex h-16 w-16 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-4xl">
            pause
          </span>
</button>
</div>
</div>
<div class="flex w-full flex-col items-center gap-4 px-4 pb-4">
<div class="flex w-full max-w-sm flex-col gap-2">
<div class="flex justify-between text-sm font-medium text-slate-500 dark:text-slate-400">
<p>Today's Progress</p>
<p>3/4</p>
</div>
<div class="h-2 w-full rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-full w-3/4 rounded-full bg-primary"></div>
</div>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">Next break in: 1 session</p>
</div>
</div>
</body></html>
