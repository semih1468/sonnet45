<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Pomodoro App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#3B82F6",
              "background-light": "#F3F4F6",
              "background-dark": "#1F2937",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark px-4" style='font-family: Inter, "Noto Sans", sans-serif;'>
<div class="flex flex-col items-center justify-center pb-8">
<div class="bg-primary p-3 rounded-full mb-4">
<span class="material-symbols-outlined text-white" style="font-size: 32px;">timer</span>
</div>
<h1 class="text-gray-900 dark:text-white tracking-light text-[32px] font-bold leading-tight text-center">Welcome Back</h1>
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal text-center pt-1">Log in to continue your focused work sessions.</p>
</div>
<div class="w-full max-w-sm">
<div class="flex flex-col gap-4 py-3">
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Email</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal" placeholder="Enter your email" value=""/>
</div>
</label>
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-gray-400 dark:text-gray-500 flex border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 items-center justify-center pr-4 rounded-r-lg border-l-0">
<span class="material-symbols-outlined" data-icon="Eye" style="font-size: 24px;">visibility</span>
</div>
</div>
</label>
</div>
<div class="flex justify-end pt-2 pb-6">
<p class="text-primary text-sm font-medium leading-normal underline cursor-pointer">Forgot Password?</p>
</div>
<button class="w-full bg-primary text-white font-bold py-4 px-4 rounded-lg text-base leading-normal hover:bg-primary/90 transition-colors">Log In</button>
<div class="text-center pt-6">
<p class="text-gray-600 dark:text-gray-400 text-sm font-normal leading-normal">Don't have an account? <a class="text-primary font-medium underline" href="#">Sign Up</a></p>
</div>
</div>
</div>
</body></html>
