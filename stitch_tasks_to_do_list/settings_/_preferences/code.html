<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pomodoro Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4A90E2",
            "background-light": "#FFFFFF",
            "background-dark": "#1E1E1E",
            "secondary-light": "#F4F4F4",
            "secondary-dark": "#2C2C2C",
            "text-light": "#1E1E1E",
            "text-dark": "#F4F4F4",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<button class="text-text-light dark:text-text-dark flex size-12 shrink-0 items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-text-light dark:text-text-dark text-xl font-bold leading-tight tracking-tight flex-1 text-center">Settings</h1>
<div class="size-12 shrink-0"></div>
</div>
<div class="px-4 py-2 space-y-8">
<!-- Session Lengths Section -->
<div>
<h2 class="text-text-light/80 dark:text-text-dark/80 text-sm font-semibold uppercase tracking-wider px-4 pb-3 pt-5">Session Lengths</h2>
<div class="bg-secondary-light dark:bg-secondary-dark rounded-xl">
<div class="@container">
<div class="relative flex w-full flex-col items-start justify-between gap-3 p-4 @[480px]:flex-row @[480px]:items-center border-b border-gray-200 dark:border-gray-700">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Focus</p>
<p class="text-text-light dark:text-text-dark text-sm font-normal leading-normal @[480px]:hidden">25 min</p>
</div>
<div class="flex h-4 w-full items-center gap-4">
<div class="flex h-1.5 flex-1 rounded-full bg-gray-300 dark:bg-gray-600">
<div class="h-full w-[40%] rounded-full bg-primary"></div>
<div class="relative">
<div class="absolute -left-2.5 -top-2 size-5 rounded-full bg-primary ring-4 ring-primary/20"></div>
</div>
</div>
<p class="text-text-light dark:text-text-dark text-sm font-normal leading-normal hidden @[480px]:block w-12 text-right">25 min</p>
</div>
</div>
</div>
<div class="@container">
<div class="relative flex w-full flex-col items-start justify-between gap-3 p-4 @[480px]:flex-row @[480px]:items-center">
<div class="flex w-full shrink-[3] items-center justify-between">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Break</p>
<p class="text-text-light dark:text-text-dark text-sm font-normal leading-normal @[480px]:hidden">5 min</p>
</div>
<div class="flex h-4 w-full items-center gap-4">
<div class="flex h-1.5 flex-1 rounded-full bg-gray-300 dark:bg-gray-600">
<div class="h-full w-[15%] rounded-full bg-primary"></div>
<div class="relative">
<div class="absolute -left-2.5 -top-2 size-5 rounded-full bg-primary ring-4 ring-primary/20"></div>
</div>
</div>
<p class="text-text-light dark:text-text-dark text-sm font-normal leading-normal hidden @[480px]:block w-12 text-right">5 min</p>
</div>
</div>
</div>
</div>
</div>
<!-- General Section -->
<div>
<h2 class="text-text-light/80 dark:text-text-dark/80 text-sm font-semibold uppercase tracking-wider px-4 pb-3 pt-5">General</h2>
<div class="bg-secondary-light dark:bg-secondary-dark rounded-xl divide-y divide-gray-200 dark:divide-gray-700">
<div class="flex items-center justify-between p-4">
<p class="text-text-light dark:text-text-dark text-base font-medium">Sound</p>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark bg-gray-300 dark:bg-gray-600">
<span class="sr-only">Use setting</span>
<span class="pointer-events-none inline-block h-5 w-5 translate-x-0 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<div class="flex items-center justify-between p-4">
<p class="text-text-light dark:text-text-dark text-base font-medium">Dark Mode</p>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark bg-primary">
<span class="sr-only">Use setting</span>
<span class="pointer-events-none inline-block h-5 w-5 translate-x-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<div class="flex items-center justify-between p-4">
<p class="text-text-light dark:text-text-dark text-base font-medium">Auto-start next session</p>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark bg-gray-300 dark:bg-gray-600">
<span class="sr-only">Use setting</span>
<span class="pointer-events-none inline-block h-5 w-5 translate-x-0 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
</div>
</div>
<!-- Language Section -->
<div>
<h2 class="text-text-light/80 dark:text-text-dark/80 text-sm font-semibold uppercase tracking-wider px-4 pb-3 pt-5">Localization</h2>
<div class="bg-secondary-light dark:bg-secondary-dark rounded-xl">
<button class="flex items-center justify-between w-full p-4 text-left">
<p class="text-text-light dark:text-text-dark text-base font-medium">Language</p>
<div class="flex items-center gap-2">
<p class="text-text-light/70 dark:text-text-dark/70">English</p>
<span class="material-symbols-outlined text-text-light/70 dark:text-text-dark/70">chevron_right</span>
</div>
</button>
</div>
</div>
</div>
<div class="h-5"></div>
</div>
</body></html>
