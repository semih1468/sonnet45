<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pomodoro Timer App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#42A5F5",
            "background-light": "#f8f5f5",
            "background-dark": "#1E1E1E",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
    .checked\:line-through:checked + p {
        text-decoration: line-through;
        color: #BDBDBD;
    }
    .checked\:opacity-50:checked + p {
      opacity: 0.5;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-dark overflow-x-hidden">
<div class="flex items-center bg-background-dark p-4 pb-2 justify-between">
<div class="text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-3xl text-gray-400">
          drag_handle
        </span>
</div>
<h2 class="text-gray-200 text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center">My Tasks</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-transparent text-gray-400">
<span class="material-symbols-outlined text-3xl">
            more_vert
          </span>
</button>
</div>
</div>
<div class="flex flex-col gap-4 p-4">
<div class="flex items-center gap-4 bg-[#2C2C2C] p-4 rounded-xl min-h-14 justify-between shadow-lg">
<div class="flex items-center gap-4 flex-1">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded-full border-gray-600 border-2 bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 focus:border-gray-600 focus:outline-none checked:line-through checked:opacity-50" type="checkbox"/>
</div>
<p class="text-gray-200 text-base font-normal leading-normal flex-1 truncate">Write a blog post about UI/UX</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">
            local_florist
          </span>
<p class="text-gray-400 text-base font-normal leading-normal">2</p>
</div>
</div>
<div class="flex items-center gap-4 bg-[#2C2C2C] p-4 rounded-xl min-h-14 justify-between shadow-lg">
<div class="flex items-center gap-4 flex-1">
<div class="flex size-7 items-center justify-center">
<input checked="" class="h-6 w-6 rounded-full border-gray-600 border-2 bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 focus:border-gray-600 focus:outline-none checked:line-through checked:opacity-50" type="checkbox"/>
</div>
<p class="text-gray-200 text-base font-normal leading-normal flex-1 truncate">Design a new feature for the app</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">
            local_florist
          </span>
<p class="text-gray-400 text-base font-normal leading-normal">4</p>
</div>
</div>
<div class="flex items-center gap-4 bg-[#2C2C2C] p-4 rounded-xl min-h-14 justify-between shadow-lg">
<div class="flex items-center gap-4 flex-1">
<div class="flex size-7 items-center justify-center">
<input class="h-6 w-6 rounded-full border-gray-600 border-2 bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 focus:border-gray-600 focus:outline-none checked:line-through checked:opacity-50" type="checkbox"/>
</div>
<p class="text-gray-200 text-base font-normal leading-normal flex-1 truncate">Read "The Design of Everyday Things"</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">
            local_florist
          </span>
<p class="text-gray-400 text-base font-normal leading-normal">1</p>
</div>
</div>
</div>
<!-- Empty State -->
<!-- <div class="flex flex-1 items-center justify-center text-center p-8">
        <div>
            <span class="material-symbols-outlined text-6xl text-gray-500">checklist</span>
            <p class="text-gray-400 text-lg mt-4">Ready to focus?</p>
            <p class="text-gray-500 text-base">Add your first task to get started!</p>
        </div>
    </div> -->
<div class="fixed bottom-6 right-6">
<button class="flex cursor-pointer items-center justify-center overflow-hidden rounded-full h-16 w-16 bg-primary text-white shadow-lg hover:bg-blue-500 transition-colors">
<span class="material-symbols-outlined text-4xl">
          add
        </span>
</button>
</div>
<!-- Modal -->
<div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
<div class="bg-[#2C2C2C] rounded-xl p-6 w-full max-w-sm mx-auto shadow-xl">
<h3 class="text-lg font-semibold text-gray-200 mb-4">Add a new task</h3>
<input class="w-full bg-[#3a3a3a] border-gray-600 rounded-lg text-gray-200 placeholder-gray-500 focus:ring-primary focus:border-primary" placeholder="Enter your task..." type="text"/>
<div class="mt-6 flex justify-end gap-3">
<button class="px-4 py-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors">Cancel</button>
<button class="px-4 py-2 rounded-lg bg-primary text-white font-semibold hover:bg-blue-500 transition-colors">Save</button>
</div>
</div>
</div>
</div>
</body></html>
